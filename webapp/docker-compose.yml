version: '3.8'

services:
  frontend:
    # 构建配置：使用 ./frontend 目录下的 Dockerfile
    build: ./frontend
    # 容器名称
    container_name: emotion-analysis-frontend
    # 重启策略：除非手动停止，否则总是重启
    restart: unless-stopped
    # 内部暴露端口（仅供容器间访问）
    expose:
      - "3527"
    # 加入 app-network 网络
    networks:
      - app-network
    environment:
      - FLASK_ENV=production

  nginx:
    # 使用官方 nginx:alpine 镜像
    image: nginx:alpine
    container_name: emotion-analysis-nginx
    restart: unless-stopped
    ports:
      #【可选修改】改为你想要的外部端口
      - "8080:80"  # 端口映射：宿主机8080 → 容器80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend # 依赖关系：先启动 frontend
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  app-network:
    driver: bridge